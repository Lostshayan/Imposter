name: Keep Render Server Online

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual test trigger from GitHub Actions tab
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        env:
          # Use GitHub secret RENDER_APP_URL if defined, otherwise default URL
          APP_URL: ${{ secrets.RENDER_APP_URL || 'https://imposter-game.onrender.com' }}
        run: |
          echo "Pinging health check at: $APP_URL/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 60 "$APP_URL/api/health" || true)
          echo "Response: $RESPONSE"
